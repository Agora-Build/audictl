[package]
name = "audictl-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux backend for audictl"

[[bin]]
name = "audictl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
