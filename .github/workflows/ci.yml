name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --manifest-path linux/Cargo.toml -- --check
      - run: cargo test --manifest-path linux/Cargo.toml --locked
      - run: cargo clippy --manifest-path linux/Cargo.toml --locked --all-targets -- -D warnings
